plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.googleservices'
version = '1.0.0'

android {
  namespace "expo.modules.googleservices"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation 'com.google.android.gms:play-services-base:18.5.0'
}
